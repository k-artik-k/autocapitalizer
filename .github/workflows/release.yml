name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v prefix"
        required: true
        default: "2.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        name: Derive version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must resemble 1.2.3 (received: $version)" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements\windows.txt
          winget install --exact --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements

      - name: Build unsigned Windows release
        if: env.HAS_WINDOWS_SIGNING != 'true'
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Version $env:VERSION

      - name: Build signed Windows release
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD must be set when WINDOWS_CERTIFICATE_BASE64 is configured.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing-certificate.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw 'signtool.exe was not found on the GitHub-hosted Windows runner.'
          }

          .\scripts\build-windows.ps1 -Version $env:VERSION `
            -SignTool $signTool `
            -CodeSignCertificate $certificatePath `
            -CodeSignPassword $env:WINDOWS_CERTIFICATE_PASSWORD

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist\windows\WhatsAppCapitalize.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -NoNewline -Encoding ascii dist\windows\WhatsAppCapitalize.exe.sha256
          Get-FileHash dist\windows\WhatsAppCapitalize-Setup-$env:VERSION-win64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -NoNewline -Encoding ascii dist\windows\WhatsAppCapitalize-Setup-$env:VERSION-win64.exe.sha256

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppCapitalize-${{ env.VERSION }}-windows-x64
          if-no-files-found: error
          path: |
            dist/windows/WhatsAppCapitalize.exe
            dist/windows/WhatsAppCapitalize.exe.sha256
            dist/windows/WhatsAppCapitalize-Setup-${{ env.VERSION }}-win64.exe
            dist/windows/WhatsAppCapitalize-Setup-${{ env.VERSION }}-win64.exe.sha256

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-latest
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.architecture }}
      HAS_MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_CODESIGN_IDENTITY != '' && 'true' || 'false' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_NOTARY_KEY_BASE64 != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && 'true' || 'false' }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
          cache-dependency-path: requirements/macos.txt

      - name: Install Apple signing certificate
        if: env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          : "${APPLE_KEYCHAIN_PASSWORD:=${RANDOM}${RANDOM}${RANDOM}}"
          certificate_path="$RUNNER_TEMP/apple-developer-id.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_CODESIGN_IDENTITY"

      - name: Build macOS DMG
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_MACOS_SIGNING == 'true' && secrets.APPLE_CODESIGN_IDENTITY || '' }}
        run: bash scripts/build-macos.sh "$VERSION"

      - name: Notarize and staple DMG
        if: env.HAS_MACOS_SIGNING == 'true' && env.HAS_NOTARIZATION == 'true'
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          dmg_path="dist/macos/WhatsAppCapitalize-${VERSION}-macos-${TARGET_ARCH}.dmg"
          echo -n "$APPLE_NOTARY_KEY_BASE64" | base64 --decode -o "$key_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Validate macOS distribution
        if: env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 dist/macos/WhatsAppCapitalize.app
          spctl --assess --type execute --verbose=4 dist/macos/WhatsAppCapitalize.app

      - name: Write SHA-256 checksum
        shell: bash
        run: |
          dmg_path="dist/macos/WhatsAppCapitalize-${VERSION}-macos-${TARGET_ARCH}.dmg"
          (
            cd dist/macos
            shasum -a 256 "$(basename "$dmg_path")" > "$(basename "$dmg_path").sha256"
          )

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppCapitalize-${{ env.VERSION }}-macos-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            dist/macos/WhatsAppCapitalize-${{ env.VERSION }}-macos-${{ matrix.architecture }}.dmg
            dist/macos/WhatsAppCapitalize-${{ env.VERSION }}-macos-${{ matrix.architecture }}.dmg.sha256

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - prepare
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: WhatsAppCapitalize-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "WhatsApp Capitalise $VERSION" \
              --generate-notes
          fi
